name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 同步网页文件到 assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: 构建 Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: 改名
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/nezone.apk

      - name: 发布到 Release（latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: nezone 最新版
          files: android/app/build/outputs/apk/debug/nezone.apk
