<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101d">
<title>nezone</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
<style>
:root{
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --ink:#fff;
  --sub:rgba(255,255,255,.62);
  --glass:rgba(255,255,255,.10);
  --glass-brd:rgba(255,255,255,.16);
  --pink:#ff6fa5; --blue:#5ec9ff; --mint:#6ff2c8; --grape:#b78bff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#14101d;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
}
/* ---------- 背景糖果 blobs ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(165deg,#241a38,#14101d 65%)}
.blob{position:absolute;border-radius:50%;opacity:.55;filter:blur(3px);animation:drift 26s ease-in-out infinite alternate;will-change:transform}
.b1{width:60vw;height:60vw;left:-14vw;top:-6vh;background:radial-gradient(circle,#ff6fa5,#c2255c)}
.b2{width:48vw;height:48vw;right:-10vw;top:32vh;background:radial-gradient(circle,#5ec9ff,#2563eb);animation-delay:-6s}
.b3{width:64vw;height:64vw;left:18vw;bottom:-16vh;background:radial-gradient(circle,#b78bff,#7c3aed);animation-delay:-11s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7vw,-5vh) scale(1.14)}}
/* ---------- 通用玻璃 ---------- */
.glass{
  background:rgba(255,255,255,.09);
  border:1px solid var(--glass-brd);border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.25);
  position:relative;overflow:hidden;
}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 50%,transparent 58%);}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
h2.sec{font-size:17px;margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
/* ---------- 顶栏 ---------- */
header{position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
  background:rgba(20,16,29,.55);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:19px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,var(--pink),var(--grape),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.searchbar{flex:1;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);font-size:14px;color:var(--sub)}
.searchbar input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;min-width:0}
/* ---------- 视图 ---------- */
main{position:fixed;z-index:1;inset:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(66px + env(safe-area-inset-top)) 14px calc(120px + env(safe-area-inset-bottom));
  display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block;animation:vin .35s var(--spring)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
/* ---------- hero ---------- */
.hero{border-radius:24px;padding:22px 20px;margin-top:6px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,111,165,.28),rgba(183,139,255,.22),rgba(94,201,255,.20)),rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3)}
.hero h1{font-size:24px;margin-bottom:6px}
.hero p{font-size:13px;color:var(--sub);line-height:1.6}
.hero .jellybtn{margin-top:14px;display:inline-block;padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700;color:#3a1030;
  background:linear-gradient(180deg,#ffd3e6,#ff9ec3);box-shadow:0 6px 18px rgba(255,111,165,.45), inset 0 1px 0 #fff;
  transition:transform .18s var(--spring)}
.hero .jellybtn:active{transform:scale(.93)}
/* ---------- 横滑行 ---------- */
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 112px;transition:transform .22s var(--spring)}
.card:active{transform:scale(.93)}
.poster{width:112px;height:158px;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.08);
  box-shadow:0 6px 14px rgba(0,0,0,.35);display:block}
.card .t{font-size:12px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:11px;color:var(--sub);margin-top:2px}
/* ---------- 网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid .card{flex:none}
.grid .poster{width:100%;height:auto;aspect-ratio:3/4.2}
/* ---------- 详情页 ---------- */
#detail{position:fixed;z-index:40;inset:0;display:none;overflow-y:auto;background:rgba(12,10,18,.94)}
#detail.on{display:block;animation:vin .3s var(--spring)}
.d-bg{height:240px;background-size:cover;background-position:center;position:relative;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.d-body{padding:0 18px calc(40px + env(safe-area-inset-bottom));margin-top:-70px;position:relative}
.d-poster{width:110px;height:156px;border-radius:14px;object-fit:cover;box-shadow:0 10px 26px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2)}
.d-title{font-size:21px;font-weight:800;margin:12px 0 6px}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:12px;color:var(--sub)}
.d-desc{font-size:13px;line-height:1.7;color:#ddd;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px;margin:12px 0}
.d-actions{display:flex;gap:10px;margin:14px 0}
.btn{flex:1;padding:13px;border-radius:999px;border:none;font-size:15px;font-weight:700;transition:transform .18s var(--spring)}
.btn:active{transform:scale(.94)}
.btn.play{background:linear-gradient(180deg,#ffd3e6,#ff9ec3);color:#3a1030;box-shadow:0 6px 18px rgba(255,111,165,.4), inset 0 1px 0 #fff}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.eps{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px}
.ep{min-width:46px;height:42px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;transition:transform .16s var(--spring)}
.ep:active{transform:scale(.9)}
.ep.sel{background:linear-gradient(180deg,#ffd3e6,#ff9ec3);color:#3a1030;font-weight:800;border:none}
.streams{margin-top:6px;display:flex;flex-direction:column;gap:9px}
.stream{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .16s var(--spring)}
.stream:active{transform:scale(.97)}
.stream .nm{font-weight:700}
.stream .inf{font-size:11px;color:var(--sub);margin-top:3px;word-break:break-all}
.stream .go{flex-shrink:0;padding:8px 16px;border-radius:999px;background:rgba(110,242,200,.2);border:1px solid rgba(110,242,200,.4);font-size:12px;font-weight:700}
.backbtn{position:sticky;top:calc(10px + env(safe-area-inset-top));z-index:2;width:38px;height:38px;border-radius:50%;
  background:rgba(20,16,29,.6);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:17px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* ---------- 播放器 ---------- */
#player{position:fixed;z-index:50;inset:0;background:#000;display:none;flex-direction:column}
#player.on{display:flex}
#player video{flex:1;width:100%;background:#000}
.p-bar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(20,16,29,.85);display:flex;gap:8px;align-items:center}
.p-bar .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.p-x{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font-size:16px}
.p-x.txt{width:auto;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700}
#epPanel{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;background:rgba(10,8,16,.93);
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
#epPanel.on{display:flex}
#epPanel .hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;margin-bottom:12px}
#epGrid{overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding-bottom:8px}
#epGrid .ep{text-align:center;padding:0 4px}
/* ---------- 来源/我的 ---------- */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin-bottom:10px;font-size:14px}
.setrow small{display:block;color:var(--sub);font-size:11px;margin-top:3px;word-break:break-all}
.del{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,90,120,.2);color:#ff8fab;font-size:15px}
.addrow{display:flex;gap:8px;margin:4px 0 16px}
.addrow input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:13px;outline:none;min-width:0}
.addrow button{padding:0 18px;border-radius:14px;border:none;font-weight:700;
  background:linear-gradient(180deg,#ffd3e6,#ff9ec3);color:#3a1030}
.preset{display:inline-block;margin:0 8px 8px 0;padding:8px 14px;border-radius:999px;font-size:12px;
  background:rgba(94,201,255,.14);border:1px solid rgba(94,201,255,.35)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:36px 20px;line-height:1.8}
/* ---------- toast ---------- */
#toast{position:fixed;z-index:99;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(20,16,29,.85);border:1px solid rgba(255,255,255,.2);padding:11px 20px;border-radius:999px;font-size:13px;
  opacity:0;transition:all .3s var(--spring);pointer-events:none;white-space:nowrap;max-width:92vw;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 底部果冻 dock ---------- */
.dock-wrap{position:fixed;z-index:35;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.dock{pointer-events:auto;display:flex;gap:4px;padding:10px 12px;border-radius:999px;position:relative;touch-action:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 50%,transparent 58%),rgba(30,22,44,.62);
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.3)}
.dock::before{content:"";position:absolute;top:0;left:14%;right:14%;height:1px;border-radius:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;will-change:transform;
  padding:6px 4px;border-radius:20px;color:rgba(255,255,255,.55);font-size:11px;cursor:pointer;
  transition:color .25s, transform .18s ease-out;transform-origin:center bottom}
.tab .ico{font-size:22px;line-height:1}
.tab.active{color:#fff}
.tab.zoom{transform:scale(1.22)}
.dock.scrubbing .tab{transition:none}
.pill{position:absolute;top:10px;bottom:10px;left:0;width:0;z-index:0;border-radius:20px;will-change:transform,width;
  background:linear-gradient(180deg,rgba(255,111,165,.35),rgba(183,139,255,.30));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(255,111,165,.25);
  transition:transform .3s var(--ease), width .3s var(--ease)}
.pill.scrub{transition:none}
.spin{width:34px;height:34px;margin:30px auto;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--pink);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- 账号 ---------- */
.acct input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:14px;outline:none;margin-bottom:10px}
.acct .row2{display:flex;gap:10px}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header>
  <div class="logo">🍮 nezone</div>
  <div class="searchbar">🔍<input id="q" placeholder="搜动漫 / 电影 / 剧集…" enterkeyhint="search"></div>
</header>

<main>
  <section class="view on" id="v-home">
    <div class="hero">
      <h1>你的私人影院 🍮</h1>
      <p>登录后收藏和观看历史自动云同步<br>果冻玻璃打底，Q弹到底</p>
      <span class="jellybtn" id="goSrc">＋ 配个播放源</span>
    </div>
    <h2 class="sec"><span class="dot"></span>热门电影</h2><div class="row" id="row-movie"></div>
    <h2 class="sec"><span class="dot" style="background:var(--blue);box-shadow:0 0 10px var(--blue)"></span>热播剧集</h2><div class="row" id="row-series"></div>
    <h2 class="sec"><span class="dot" style="background:var(--mint);box-shadow:0 0 10px var(--mint)"></span>热门动漫</h2><div class="row" id="row-anime"></div>
  </section>
  <section class="view" id="v-anime"><div class="grid" id="grid-anime" style="margin-top:6px"></div></section>
  <section class="view" id="v-movie"><div class="grid" id="grid-movie" style="margin-top:6px"></div></section>
  <section class="view" id="v-my">
    <h2 class="sec"><span class="dot" style="background:var(--mint);box-shadow:0 0 10px var(--mint)"></span>我的账号</h2>
    <div class="glass setrow" id="acctBox" style="display:block"></div>
    <h2 class="sec"><span class="dot"></span>继续观看</h2><div class="row" id="row-hist"></div>
    <h2 class="sec"><span class="dot" style="background:var(--grape);box-shadow:0 0 10px var(--grape)"></span>我的收藏</h2><div class="row" id="row-fav"></div>
    <h2 class="sec"><span class="dot" style="background:var(--blue);box-shadow:0 0 10px var(--blue)"></span>播放源管理</h2>
    <div class="glass setrow" style="display:block">
      <div style="font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:10px">播放源用 Stremio 插件协议，粘个 manifest 链接就行（跟 Nuvio 加插件一个思路）。源失效就删了换，不影响 App 本体。</div>
      <div class="addrow"><input id="addonUrl" placeholder="粘贴 addon 的 manifest.json 链接"><button id="addonAdd">添加</button></div>
      <div id="addonList"></div>
      <div style="margin-top:6px"><span style="font-size:12px;color:var(--sub)">试试这些：</span><br>
        <span class="preset" data-u="https://nezone-source.vercel.app/manifest.json">nezone 官方源（推荐）</span>
        <span class="preset" data-u="https://torrentio.strem.fun/providers=yts,eztv,rarbg,1337x,thepiratebay,kickasstorrents,torrentgalaxy,magnetdl,horriblesubs,nyaasi,tokyotosho,anidex/manifest.json">Torrentio（未验证）</span>
      </div>
    </div>
    <div class="glass setrow"><div>关于 nezone<small>v6 · 单文件 · 登录后收藏/历史云端同步<br>片源来自你配置的第三方源，App 本体不存任何视频</small></div></div>
  </section>
</main>

<div id="detail"></div>
<div id="player"><video id="vid" controls playsinline></video><div class="p-bar"><div class="t" id="pTitle"></div><button class="p-x txt" id="pRate" title="倍速">1x</button><button class="p-x" id="pPip" title="画中画">🗔</button><button class="p-x" id="pNext" title="下一集">⏭</button><button class="p-x txt" id="pEps">选集</button><button class="p-x" id="pFs" title="全屏横屏">⛶</button><button class="p-x" id="pClose">✕</button></div><div id="epPanel"><div class="hd"><span id="epPanelTitle">选集</span><button class="p-x" id="epPanelClose">✕</button></div><div id="epGrid"></div></div></div>
<div id="toast"></div>

<div class="dock-wrap"><nav class="dock" id="dock"><div class="pill" id="pill"></div>
  <div class="tab active" data-v="v-home"><span class="ico">🏠</span>首页</div>
  <div class="tab" data-v="v-anime"><span class="ico">🎬</span>动漫</div>
  <div class="tab" data-v="v-movie"><span class="ico">🎞️</span>电影</div>
  <div class="tab" data-v="v-my"><span class="ico">🍮</span>我的</div>
</nav></div>

<script>
/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
async function getJSON(url,ms=15000){
  const c=new AbortController(),h=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)return null;return await r.json()}
  catch(e){return null}finally{clearTimeout(h)}
}
const store={
  get(k,d){try{const v=localStorage.getItem('jelly_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('jelly_'+k,JSON.stringify(v))}catch(e){}}
};
/* ================= 数据源 ================= */
const CINEMETA='https://v3-cinemeta.strem.io';
async function cmCatalog(type,extra=''){const d=await getJSON(`${CINEMETA}/catalog/${type}/top${extra}.json`);return d&&d.metas?d.metas:[]}
async function cmMeta(type,id){const d=await getJSON(`${CINEMETA}/meta/${type}/${id}.json`);return d&&d.meta?d.meta:null}
async function kitsu(path){const d=await getJSON('https://kitsu.io/api/edge'+path,15000);if(!d||!d.data)return[];return Array.isArray(d.data)?d.data:[d.data]}
const kPoster=a=>{const p=a.attributes.posterImage;return p?(p.medium||p.small||p.original):''};
const kCover=a=>{const c=a.attributes.coverImage;return c?(c.large||c.original):''};
/* ================= 播放源（Stremio 协议，用户自配） ================= */
function addons(){return store.get('addons',[])}
const OFFICIAL='https://nezone-source.vercel.app';
function zhHints(){return store.get('zh',{})}
function saveZh(id,name){const z=zhHints();if(z[id]!==name){z[id]=name;store.set('zh',z)}}
async function addonStreams(base,type,id){
  const b=base.replace(/\/manifest\.json\/?$/,'').replace(/\/$/,'');
  const isOff=b.startsWith(OFFICIAL);
  const hint=isOff&&curDetail?(curDetail.hint||curDetail.name||''):'';
  const q=hint?('?q='+encodeURIComponent(hint)):'';
  const d=await getJSON(`${b}/stream/${type}/${id}.json${q}`,isOff?20000:15000);
  if(!d||!d.streams){
    if(isOff){
      const seg=id.split(':'),we=parseInt(seg[seg.length-1],10)||0;
      return directResolveStreams(hint||(curDetail?curDetail.name:''),we);
    }
    return [];
  }
  return d.streams.filter(s=>s.url).map(s=>({name:s.name||'线路',info:(s.title||'').split('\n')[0]||s.url.slice(0,60),url:s.url,from:base}));
}
/* ============ 直连资源站：官方源服务器连不上时的后路（资源站是国内站，直连更快更稳） ============ */
const CMS_APIS=[
  {name:'非凡',base:'http://cj.ffzyapi.com/api.php/provide/vod/'},
  {name:'百度',base:'https://api.apibdzy.com/api.php/provide/vod/'},
  {name:'量子',base:'https://cj.lziapi.com/api.php/provide/vod/'}
];
async function directSearchMetas(wd){
  const byName={};
  for(let i=0;i<CMS_APIS.length;i++){
    const d=await getJSON(CMS_APIS[i].base+'?ac=list&wd='+encodeURIComponent(wd),12000);
    const list=d&&Array.isArray(d.list)?d.list:[];
    for(const v of list){
      if(!v.vod_name)continue;
      const epn=parseInt(((v.vod_remarks||'').match(/(\d+)\s*集/)||[])[1]||'0',10);
      const prev=byName[v.vod_name];
      if(!prev||epn>=prev._ep)byName[v.vod_name]={id:'nz:'+i+':'+v.vod_id,name:v.vod_name,poster:v.vod_pic||'',remarks:v.vod_remarks||'',type:v.type_name||'',_ep:epn};
    }
  }
  return Object.values(byName).slice(0,30);
}
function cmsEpisodes(vod){
  const groups=String(vod.vod_play_url||'').split('$$$'),out=[];
  for(let i=0;i<groups.length;i++){
    const eps=groups[i].split('#').filter(Boolean).map(seg=>{const x=seg.lastIndexOf('$');if(x<0)return null;return{name:seg.slice(0,x)||'正片',url:seg.slice(x+1).trim()}}).filter(Boolean);
    for(const e of eps)if(/^https?:\/\//.test(e.url)&&/(\.m3u8|\.mp4)(\?|$)/i.test(e.url))out.push(e);
    if(out.length)break;
  }
  return out;
}
async function directVod(a,id){
  const api=CMS_APIS[a];if(!api)return null;
  const d=await getJSON(api.base+'?ac=detail&ids='+encodeURIComponent(id),15000);
  if(!d||!Array.isArray(d.list)||!d.list.length)return null;
  const vod=d.list[0],eps=cmsEpisodes(vod);
  return {name:vod.vod_name,poster:vod.vod_pic||'',remarks:vod.vod_remarks||'',year:vod.vod_year||'',area:vod.vod_area||'',
    desc:String(vod.vod_content||vod.vod_blurb||'').replace(/<[^>]*>/g,'').replace(/&nbsp;|&quot;|&amp;/g,' ').trim(),
    episodes:eps.map(e=>({name:e.name,url:e.url}))};
}
async function directResolveStreams(title,wantEp){
  if(!title)return [];
  for(const api of CMS_APIS){
    const d=await getJSON(api.base+'?ac=detail&wd='+encodeURIComponent(title),15000);
    if(!d||!Array.isArray(d.list)||!d.list.length)continue;
    const exact=d.list.filter(v=>v.vod_name===title);
    const cont=d.list.filter(v=>v.vod_name&&(v.vod_name.includes(title)||title.includes(v.vod_name)));
    const pool=exact.length?exact:(cont.length?cont:[d.list[0]]);
    let best=null,bestEps=[];
    for(const cand of pool){const e=cmsEpisodes(cand);if(e.length>bestEps.length){best=cand;bestEps=e}}
    if(!best||!bestEps.length)continue;
    const eps=bestEps.slice();
    if(wantEp>0&&wantEp<=eps.length){const[w]=eps.splice(wantEp-1,1);eps.unshift(w)}
    return eps.slice(0,2000).map(e=>({name:api.name+' · '+e.name,info:best.vod_name+' '+e.name+'（'+api.name+'）',url:e.url,from:OFFICIAL}));
  }
  return [];
}

  if(curView==='v-home'){/* 首页搜电影 */ }

  if(isAnime){
    let done=false;
    if(/[一-鿿]/.test(q)){
      const bg=await getJSON('https://api.bgm.tv/search/subject/'+encodeURIComponent(q)+'?type=2&responseGroup=large');
      const list=(bg&&bg.list||[]).slice(0,8),found=[];
      for(const s of list){
        const res=await kitsu('/anime?filter[text]='+encodeURIComponent(s.name)+'&page[limit]=1');
        if(res.length){const a=res[0];found.push({a,zh:s.name_cn||s.name,img:(s.images&&(s.images.large||s.images.common))||kPoster(a)})}
      }

    getJSON(OFFICIAL+'/search.json?wd='+encodeURIComponent(q),10000).then(async srcD=>{
      let metas=(srcD&&srcD.metas)||[];

    const srcItems=srcMetas.map(m=>({kind:'src',id:m.id,name:m.name,poster:m.poster,sub:'📺 源内 · '+(m.remarks||m.type||'集数全')}));
    const all=[...srcItems,...mv.map(m=>({...m,kind:'cm:movie'})),...se.map(m=>({...m,kind:'cm:series'}))].slice(0,36);
    if(/[一-鿿]/.test(q))all.forEach(m=>{if(m.kind&&m.kind.startsWith('cm:'))saveZh(m.id,q)});

async function probeStreams(all){
  const res=await Promise.all(all.map(async(s,i)=>{
    const c=new AbortController(),h=setTimeout(()=>c.abort(),4000),st=performance.now();
    try{await fetch(s.url,{mode:'no-cors',signal:c.signal});return{i,ms:performance.now()-st}}catch(e){return{i,ms:1e9}}finally{clearTimeout(h)}
  }));
  res.sort((a,b)=>a.ms-b.ms);
  if(res.length&&res[0].ms<1e9){
    const el=document.querySelector('.stream[data-i="'+res[0].i+'"] .nm');

(function(){
  const v=$('vid');let sx=0,sy=0,moved=false,lastTap=0,lastX=0;
  v.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false},{passive:true});
  v.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.abs(t.clientX-sx)>40)moved=true},{passive:true});
  v.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(moved&&Math.abs(dx)>50&&Math.abs(dy)<40){
      const sec=Math.max(-120,Math.min(120,Math.round(dx/4)));
      if(sec&&v.duration){v.currentTime=Math.max(0,Math.min(v.duration-1,v.currentTime+sec));toast((sec>0?'快进 ':'快退 ')+Math.abs(sec)+' 秒 → '+fmtT(v.currentTime))}
      return;
    }
    const now=Date.now();
    if(now-lastTap<300&&Math.abs(t.clientX-lastX)<80&&v.duration){
      const w=window.innerWidth;
      if(t.clientX<w/3){v.currentTime=Math.max(0,v.currentTime-10);toast('⏪ 退 10 秒')}
      else if(t.clientX>w*2/3){v.currentTime=Math.min(v.duration-1,v.currentTime+10);toast('⏩ 进 10 秒')}
      lastTap=0;
    }else{lastTap=now;lastX=t.clientX}
  },{passive:true});
})();

let favCheckBusy=false;
async function checkFavUpdates(fav){
  if(favCheckBusy)return;
  const targets=(fav||[]).filter(f=>f.kind==='src'&&f.eps>0).slice(0,3);
  if(!targets.length)return;
  favCheckBusy=true;
  let changed=false;
  for(const f of targets){
    const p=String(f.id).split(':');
    const d=await getJSON(OFFICIAL+'/vod.json?lite=1&a='+(p[1]||'0')+'&id='+(p[2]||''),15000);
    if(d&&d.count>f.eps){f.eps=d.count;f.sub='🆕 更新至第'+d.count+'集';changed=true}
  }
  favCheckBusy=false;
  if(changed){
    const cur=store.get('fav',[]);
    targets.forEach(t=>{const c=cur.find(x=>x.key===t.key);if(c){c.eps=t.eps;c.sub=t.sub}});
    store.set('fav',cur);
    const rf=$('row-fav');if(rf){rf.innerHTML=cur.length?cur.map(cardHTML).join(''):rf.innerHTML;bindCards(rf)}
    toast('有收藏的剧更新了 🆕');
  }
}

async function addAddon(url){
  url=(url||'').trim();if(!url)return toast('先粘贴链接');
  if(!/manifest\.json/.test(url))url=url.replace(/\/?$/,'')+'/manifest.json';
  toast('正在验证…');
  const m=await getJSON(url,12000);
  if(!m||!m.id)return toast('这个链接读不到 manifest，检查下');
  const list=addons();
  if(list.find(a=>a.url===url))return toast('这个源已经加过了');
  list.push({url:url,name:m.name||'未命名源'});store.set('addons',list);renderAddons();toast('已添加：'+(m.name||'源'));
}

/* ================= dock：Nuvio 式干脆 —— 点按即切，按住拖胶囊 1:1 贴手滑过去，不顿挫 ================= */
let curView='v-home';
const dock=$('dock'),pill=$('pill'),tabs=[...dock.querySelectorAll('.tab')];
function movePill(el,scrub){
  const r=el.getBoundingClientRect(),d=dock.getBoundingClientRect();
  pill.style.width=r.width+'px';
  pill.classList.toggle('scrub',!!scrub);
  pill.style.transform='translateX('+(r.left-d.left)+'px)';
}
function showView(v,keep){
  curView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));
  tabs.forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  movePill(dock.querySelector('[data-v="'+v+'"]'));
  if(v==='v-my')renderMy();
}
tabs.forEach(t=>t.addEventListener('click',()=>{if(t.dataset.v!==curView)showView(t.dataset.v)}));
(function(){
  let active=false,curIdx=0;
  function follow(clientX){
    const dr=dock.getBoundingClientRect();
    const w=pill.offsetWidth||64;
    const pad=12;
    let x=clientX-dr.left-w/2;
    x=Math.max(pad,Math.min(dr.width-pad-w,x));
    pill.classList.add('scrub');
    pill.style.transform='translateX('+x+'px)';
    let best=0,bd=1e9;
    tabs.forEach((t,i)=>{
      const r=t.getBoundingClientRect(),c=r.left+r.width/2,dd=Math.abs(c-clientX);
      const s=1+0.22*Math.max(0,1-dd/110);
      t.style.transform='scale('+s.toFixed(3)+')';
      if(dd<bd){bd=dd;best=i}
    });
    curIdx=best;
  }
  dock.addEventListener('pointerdown',e=>{
    active=true;
    dock.classList.add('scrubbing');
    try{dock.setPointerCapture(e.pointerId)}catch(_){}
    follow(e.clientX);
  });
  dock.addEventListener('pointermove',e=>{if(active)follow(e.clientX)});
  const end=()=>{
    if(!active)return;active=false;
    dock.classList.remove('scrubbing');
    pill.classList.remove('scrub');
    tabs.forEach(t=>{t.style.transform=''});
    const tab=tabs[curIdx];
    if(tab&&tab.dataset.v!==curView)showView(tab.dataset.v);
    else if(tab)movePill(tab);
  };
  dock.addEventListener('pointerup',end);dock.addEventListener('pointercancel',end);
})();
window.addEventListener('resize',()=>movePill(dock.querySelector('[data-v="'+curView+'"]')));
window.addEventListener('load',()=>{movePill(dock.querySelector('[data-v="v-home"]'));loadHome();loadAnimeTab();loadMovieTab();renderMy();sbInit()});
